# Continuous integration (ADR-0069).
#
# The point of this file is not that the suite runs unattended. It is that the
# suite finally runs on MYSQL. Everything here has always been tested on SQLite in
# memory, while dev and production run MySQL — a gap `CLAUDE.md` names as the one
# standing reason a green suite is not proof, and which had already let three
# real defects through by the day this was written.
#
# So the matrix is the whole design: the same suite, once on the database the
# developer runs and once on each database the site ships on. None is optional.
#
# Since 2026-09-13 that is three, not two (ADR-0079). The staging server — and the
# production server it stands in for — runs **MariaDB**, not MySQL, and Laravel
# knows the difference: it ships a separate driver and a separate grammar for it
# (`MariaDbGrammar`, query and schema both), so the SQL this application emits is
# not the same SQL on the two. Until this file grew a third column, nothing
# anywhere had ever run a single test against the engine the site is deployed on.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: nobody needs the result of a commit that
# has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests · ${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      # Every result, always. An engine-specific failure is the interesting one,
      # and stopping the others would hide which of the three broke.
      fail-fast: false
      matrix:
        database: [sqlite, mysql, mariadb]

    services:
      mysql:
        # 8.3, the version the dev machine runs, with ONLY_FULL_GROUP_BY and
        # STRICT_TRANS_TABLES on by default — the strictness this code is
        # written against.
        image: mysql:8.3
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: soa_htc_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb:
        # 11.8, the version measured on the staging server 2026-09-13. Its default
        # sql_mode matches what that server reports — STRICT_TRANS_TABLES without
        # ONLY_FULL_GROUP_BY — so this job is lenient in exactly the way the
        # deployed database is, which is the point: a GROUP BY the MySQL job
        # rejects may pass here, and that difference is now visible rather than
        # discovered on the server.
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: true
          MARIADB_DATABASE: soa_htc_test
        # 🪤 3307 on the runner: the MySQL service already holds 3306, and both
        # containers start for every job in the matrix whatever it is testing.
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # `intl` for locale-aware sorting, `zip`/`gd` for the .xlsx and PDF
          # writers, `pdo_mysql` for the two columns that need it — MariaDB is
          # reached through the same PDO driver, with a different Laravel grammar
          # on top of it.
          extensions: intl, zip, gd, pdo_mysql, pdo_sqlite, bcmath
          coverage: none

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      # 🪤 `.env.example` is the PRODUCTION template (ADR-0058), which is exactly
      # what should be exercised here — but it ships without a key, and signed
      # URLs (the exam media, ADR-0059) cannot be verified without one. Copied
      # before `composer install`, because that runs `package:discover` and
      # artisan should boot against the same file everything else uses.
      # `phpunit.xml` puts APP_ENV back to `testing` for the test process itself.
      - run: cp .env.example .env

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: php artisan key:generate

      - name: Tests
        env:
          # `mariadb` is a connection of its own in `config/database.php`, with
          # Laravel's MariaDB driver behind it — not `mysql` pointed elsewhere.
          # Naming it here is what puts the MariaDB grammar under test.
          DB_CONNECTION: ${{ matrix.database }}
          DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'soa_htc_test' }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database == 'mariadb' && '3307' || '3306' }}
          DB_USERNAME: root
          DB_PASSWORD: ''
        # 🪤 These override `phpunit.xml`, which hardcodes sqlite/:memory:.
        # PHPUnit's `<env>` does not overwrite a variable that is already set,
        # which is what makes one configuration serve both halves of the matrix.
        run: php artisan test

  static:
    name: Formatting, types and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, gd
          coverage: none

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: cp .env.example .env

      - run: composer install --no-interaction --prefer-dist --no-progress

      # The same three commands the pre-push ritual runs by hand
      # (`docs/06_DEPLOYMENT.md`, CLAUDE.md), so that forgetting one is caught
      # rather than merged.
      - run: vendor/bin/pint --test

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run type-check

      # The bundle is not in the repository, so a build that only fails on a
      # clean checkout would be found by whoever deploys.
      - run: npm run build
